<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Gym Buddies</title>
    <meta name="description" content="A two-person gym accountability tracker. Check in, keep streaks, out-train your buddy.">
    <meta name="theme-color" content="#0a0c11">
    <meta name="color-scheme" content="dark">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Gym Buddies">
    <meta name="format-detection" content="telephone=no">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="stylesheet" href="gym.css?v=3.2.0">
</head>
<body>
    <div class="app">
        <div id="auth" class="auth" hidden></div>

        <div id="main" hidden>
            <header class="topbar">
                <div class="topbar-text">
                    <span class="topbar-sub" id="tb-sub"></span>
                    <h1 id="tb-title">Gym Buddies</h1>
                </div>
                <button id="sync-btn" class="sync-pill" data-action="sync-now" aria-label="Sync status"></button>
            </header>

            <main>
                <section id="view-today" class="view" aria-label="Today"></section>
                <section id="view-calendar" class="view" aria-label="Calendar"></section>
                <section id="view-battle" class="view" aria-label="Battle"></section>
                <section id="view-trophies" class="view" aria-label="Trophies"></section>
                <section id="view-me" class="view" aria-label="Profile"></section>
            </main>

            <nav class="tabbar" aria-label="Main">
                <div class="tabbar-inner">
                    <button class="tab" data-action="tab" data-tab="today">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8c.9 3.4 5.2 5.6 5.2 10.4a5.2 5.2 0 0 1-10.4 0c0-2.6 1.5-4.2 2.6-5.2.3 1.7 1 2.7 2.1 3.1 0-3.1.4-5.6.5-8.3z"/></svg>
                        <span>Today</span>
                    </button>
                    <button class="tab" data-action="tab" data-tab="calendar">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
                        <span>Calendar</span>
                    </button>
                    <button class="tab" data-action="tab" data-tab="battle">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-8M12 20V4M19 20v-5"/></svg>
                        <span>Battle</span>
                    </button>
                    <button class="tab" data-action="tab" data-tab="trophies">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0V4z"/><path d="M8 6H5.5a2 2 0 0 0 2 4H8M16 6h2.5a2 2 0 0 1-2 4H16M12 13v4M8.5 20.5h7M10 17h4"/></svg>
                        <span>Trophies</span>
                    </button>
                    <button class="tab" data-action="tab" data-tab="me">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c1.4-3.6 4.2-5.3 7.5-5.3s6.1 1.7 7.5 5.3"/></svg>
                        <span>Me</span>
                    </button>
                </div>
            </nav>
        </div>
    </div>

    <div id="sheet" class="sheet-wrap" hidden>
        <div class="sheet-backdrop" data-action="close-sheet"></div>
        <div class="sheet" role="dialog" aria-modal="true">
            <div class="sheet-handle"></div>
            <div id="sheet-body"></div>
        </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="confetti" class="confetti" aria-hidden="true"></div>
    <input type="file" id="photo-input" class="visually-hidden" accept="image/*" tabindex="-1" aria-hidden="true">

    <noscript><p style="padding:24px;color:#fff">Gym Buddies needs JavaScript enabled.</p></noscript>

    <script src="config.js?v=3.2.0"></script>
    <script src="gym.js?v=3.2.0"></script>
</body>
</html>
